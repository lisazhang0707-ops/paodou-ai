<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哥哥学习仪表盘</title>
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --math:#2563eb;--math-light:#eff6ff;--math-bg:#dbeafe;
  --chinese:#16a34a;--chinese-light:#f0fdf4;--chinese-bg:#dcfce7;
  --english:#7c3aed;--english-light:#faf5ff;--english-bg:#ede9fe;
  --science:#ea580c;--science-light:#fff7ed;--science-bg:#ffedd5;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
  --gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;
  --radius:6px;--shadow:0 1px 3px rgba(0,0,0,.08);
  --font:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
body{font-family:var(--font);color:var(--gray-900);background:var(--gray-50);line-height:1.6}
#app{max-width:1100px;margin:0 auto;padding:16px 20px}

/* ===== Header ===== */
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--gray-200);margin-bottom:16px;flex-wrap:wrap;gap:8px}
header h1{font-size:1.4rem;font-weight:700}
.header-info{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--gray-500)}
.save-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.save-dot.saved{background:var(--green)}.save-dot.unsaved{background:var(--amber)}

/* ===== Nav Tabs ===== */
nav{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
nav button{padding:8px 20px;border:1px solid var(--gray-200);background:#fff;border-radius:var(--radius);cursor:pointer;font-size:.9rem;font-family:var(--font);transition:all .15s}
nav button:hover{background:var(--gray-100)}
nav button.active{color:#fff;font-weight:600}
nav button[data-tab="math"].active{background:var(--math);border-color:var(--math)}
nav button[data-tab="science"].active{background:var(--science);border-color:var(--science)}
nav button[data-tab="chinese"].active{background:var(--chinese);border-color:var(--chinese)}
nav button[data-tab="english"].active{background:var(--english);border-color:var(--english)}
nav button[data-tab="overview"].active{background:var(--gray-700);border-color:var(--gray-700)}

/* ===== Cards ===== */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h2{font-size:1.1rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gray-100)}
.card h3{font-size:.95rem;margin:12px 0 8px}

/* ===== Grid layouts ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:768px){.grid2,.grid3{grid-template-columns:1fr}}

/* ===== Progress bars ===== */
.progress-wrap{margin:8px 0}
.progress-label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px}
.progress-bar{height:10px;background:var(--gray-100);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:5px;transition:width .3s}
.progress-fill.math{background:var(--math)}.progress-fill.science{background:var(--science)}
.progress-fill.chinese{background:var(--chinese)}.progress-fill.english{background:var(--english)}

/* ===== Status badges ===== */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600}
.badge-mastered{background:#dcfce7;color:#166534}
.badge-good{background:#dbeafe;color:#1e40af}
.badge-qualified{background:#fef3c7;color:#92400e}
.badge-none{background:var(--gray-100);color:var(--gray-500)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.dot-mastered{background:var(--green)}.dot-good{background:var(--math)}
.dot-qualified{background:var(--amber)}.dot-none{background:var(--gray-300);border:1px solid var(--gray-400)}

/* ===== Self-check grid ===== */
.sc-grid{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;max-width:600px}
.sc-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:.75rem;cursor:pointer;border:1px solid var(--gray-200);transition:all .15s;font-weight:600}
.sc-cell:hover{transform:scale(1.15);z-index:1}
.sc-pass{background:#dcfce7;color:#166534;border-color:#86efac}
.sc-warn{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.sc-fail{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.sc-none{background:#fff;color:var(--gray-500)}
.sc-popover{position:fixed;background:#fff;border:2px solid var(--gray-300);border-radius:var(--radius);padding:16px;z-index:100;max-width:400px;box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:.85rem}
.sc-popover .q{font-weight:600;margin-bottom:8px}
.sc-popover .a{color:var(--gray-500);margin-bottom:8px;font-size:.8rem}
.sc-popover .btns{display:flex;gap:6px}
.sc-popover button{padding:4px 10px;border-radius:4px;border:1px solid var(--gray-300);cursor:pointer;font-size:.8rem;font-family:var(--font)}
.sc-popover button.pass{background:#dcfce7}.sc-popover button.warn{background:#fef3c7}.sc-popover button.fail{background:#fee2e2}

/* ===== Topic accordion ===== */
.topic-list{list-style:none}
.topic-item{border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:6px;overflow:hidden}
.topic-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:var(--gray-50);user-select:none}
.topic-header:hover{background:var(--gray-100)}
.topic-header .left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.topic-header .title{font-size:.9rem;font-weight:600}
.topic-header .meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topic-body{display:none;padding:14px;border-top:1px solid var(--gray-200);font-size:.88rem}
.topic-body.open{display:block}
.topic-body ul,.topic-body ol{padding-left:20px;margin:8px 0}
.topic-body li{margin:4px 0}
.topic-body .rubric-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.82rem}
.topic-body .rubric-table th,.topic-body .rubric-table td{border:1px solid var(--gray-200);padding:6px 10px;text-align:left}
.topic-body .rubric-table th{background:var(--gray-100);font-weight:600}
.topic-body .file-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.topic-body .file-links a,.topic-body .file-links button{font-size:.8rem;padding:4px 10px;border:1px solid var(--gray-300);border-radius:4px;text-decoration:none;color:var(--gray-700);background:#fff;cursor:pointer;font-family:var(--font)}
.topic-body .file-links a:hover,.topic-body .file-links button:hover{background:var(--gray-100)}
.chevron{transition:transform .2s;font-size:.8rem;color:var(--gray-500)}
.chevron.open{transform:rotate(90deg)}

/* ===== Alerts ===== */
.alert{padding:10px 14px;border-radius:var(--radius);margin:6px 0;font-size:.85rem;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:#fef3c7;border:1px solid #fcd34d;color:#92400e}
.alert-danger{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.alert-success{background:#dcfce7;border:1px solid #86efac;color:#166534}
.alert-info{background:var(--gray-100);border:1px solid var(--gray-300);color:var(--gray-700)}
.alert-icon{font-size:1.1rem;flex-shrink:0}

/* ===== Forms ===== */
select,input[type=number],textarea{font-family:var(--font);font-size:.85rem;padding:6px 10px;border:1px solid var(--gray-300);border-radius:4px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--math);outline-offset:-1px}
textarea{width:100%;resize:vertical;min-height:50px}
.form-row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.form-row label{font-size:.85rem;font-weight:600;min-width:60px}

/* ===== Oral arithmetic chart ===== */
.oral-bars{display:flex;align-items:flex-end;gap:8px;height:100px;padding:0 4px}
.oral-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.oral-bar{width:100%;max-width:40px;border-radius:3px 3px 0 0;background:var(--math);min-height:4px;transition:height .3s}
.oral-bar-label{font-size:.7rem;color:var(--gray-500)}

/* ===== File links ===== */
.file-link-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.copy-btn{padding:2px 8px;font-size:.75rem;border:1px solid var(--gray-300);border-radius:3px;cursor:pointer;background:#fff;color:var(--gray-700);font-family:var(--font)}
.copy-btn:hover{background:var(--gray-100)}
.copied{color:var(--green);font-size:.75rem}

/* ===== Today highlight ===== */
.today-card{border-left:4px solid var(--math)}
.today-card h2{color:var(--math)}

/* ===== Footer ===== */
footer{text-align:center;padding:20px 0;font-size:.8rem;color:var(--gray-500);border-top:1px solid var(--gray-200);margin-top:20px}
footer .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}

/* ===== Grading Tab ===== */
.grading-upload{border:2px dashed var(--gray-300);border-radius:var(--radius);padding:30px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gray-50)}
.grading-upload:hover{border-color:var(--math);background:var(--math-light)}
.grading-upload.dragover{border-color:var(--math);background:var(--math-light)}
.grading-upload input{display:none}
.grading-img{max-width:100%;max-height:400px;border-radius:var(--radius);border:1px solid var(--gray-200)}
.grading-history-item{border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.grading-history-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--gray-50);cursor:pointer;font-size:.9rem;font-weight:600}
.grading-history-body{display:none;padding:14px;border-top:1px solid var(--gray-200)}
.grading-history-body.open{display:block}
.problem-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;font-size:.85rem}
.problem-row .num{font-weight:600;min-width:50px}
.problem-row .result{min-width:60px;text-align:center}
.problem-row select,.problem-row input{font-size:.82rem;padding:3px 8px}
.result-correct{color:var(--green);font-weight:600}
.result-wrong{color:var(--red);font-weight:600}
.result-half{color:var(--amber);font-weight:600}
.error-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.error-stat-card{text-align:center;padding:12px;border-radius:var(--radius);background:var(--gray-50)}
.error-stat-card .count{font-size:1.8rem;font-weight:700}
.error-stat-card .label{font-size:.8rem;color:var(--gray-500)}
@media(max-width:768px){.error-stats{grid-template-columns:repeat(2,1fr)}}

/* ===== Print ===== */
@media print{
  nav,footer,.copy-btn,.topic-header,.save-dot,.alert button{display:none!important}
  .topic-body{display:block!important}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body{font-size:11pt;background:#fff}
  #app{max-width:100%}
}
</style>
</head>

0 题，约 4 分钟","错题口述：从本周错题中挑 3 道最有代表性的完整讲一遍思路，约 8 分钟","用一张白纸不看书画出「大数的认识」思维导图（学了什么→方法→最容易错的是什么），约 8 分钟"],"mastery":{"qualified":"口算速度 >= 16 题/分钟；黄冈本周错题重做正确率 >= 80%","good":"口算速度 >= 18 题/分钟；错题全对且能完整口述每题思路","excellent":"口算速度 >= 20 题/分钟全对；能画出完整的本周知识思维导图"},"examImpact":"高（贯穿所有考试）：口算速度是看不见的隐形分数。同样一道计算题口算快的学生 5 秒出答案慢的 30 秒——差 25 秒。中考科学 120 分钟做 160 分，每 1 秒都算数。","examExample":"中考科学的送分计算题：已知路程 340m，速度 340m/s，求时间。340÷340=1（秒），口算直接出答案。如果口算不熟，写竖式、检查、重算……30 秒没了。而这道题只值 2 分。30 秒 ÷ 2 分 = 太贵了，不值得。","selfCheck":["口算计时挑战：4 分钟 20 题，速度和正确率是多少？比周一进步了吗？","从本周错题中挑一道最坑的讲一讲它坑在哪里","不看书说出大数的认识包括哪几个知识点？（至少 5 个）","下周要学什么？（提示：打开课本往后翻两页）","这周学数学的感觉怎么样？哪个瞬间你觉得「哦，原来是这样！」？"]},{"title":"大数的改写（万/亿作单位）","kousuan":"第 6 页","huanggang":"第 8 页","knowledge":["改写规则：整万数改写成万作单位——去掉末尾4个0，写万字。如300000=30万；整亿数改写成亿作单位——去掉末尾8个0，写亿字。如500000000=5亿","关键操作：画分级线。从右起每4位画一条线。个级（末尾4位）全是0→可以改写为万；万级和个级全是0（末尾8位全是0）→可以改写为亿","改写示范：23000000→分级2300|0000→个级全是0→2300万。1200000000→分级12|0000|0000→万级和个级全是0→12亿","易错点：改写不改变数的大小，300000=30万（等号成立，不是约等号）；只有末尾全是0时才能用万亿改写，中间有非0数字不能直接改"],"method":["读课本第10-11页（大数的改写），约7分钟","在白纸上练习：给10个大数画分级线，判断能否改写为万或亿，能改写的写出改写结果，约8分钟","做黄冈小状元第8页练习，约5分钟"],"mastery":{"qualified":"能正确判断一个大数能否改写为万或亿，正确率>=80%","good":"10秒内判断能否改写并正确写出改写结果，正确率100%","excellent":"能解释为什么改写不改变数的大小（计数单位从一变万）"},"examImpact":"中高（5-8分）：改写是四年级期末必考题（填空2-3分）。七年级科学中大量使用万亿单位表述数据，能快速换算等于节省审题时间。","examExample":"嘉兴中考数学填空题：某市人口约230万人，写成数字是___。这道题就是改写的逆向操作——230万=2300000。","selfCheck":["把4500000改写成万作单位","把800000000改写成亿作单位","23000000能直接改写成万吗？怎么改？能改写成亿吗？为什么？","改写前后的数大小变了吗？为什么？用计数单位来解释","判断对错：40050000=4005万。如果不对，正确应该怎么改？"]},{"title":"四舍五入求近似数","kousuan":"第 7 页","huanggang":"第 9 页","knowledge":["核心规则——四舍五入：找到要保留的数位（如精确到万位）；看它右边一位的数字：如果>=5→向前一位进1（五入）；如果<=4→舍去（四舍）；保留位右边的数字全部变成0","四舍五入口诀：0、1、2、3、4，舍去不要；5、6、7、8、9，向前一位进一","示范：230456精确到万位→万位是3（23|0456）→看千位是0（<5）→舍去→23万。230456≈23万（注意：用约等号≈，不是等号=）","关键区分：改写用等号=（数大小没变），近似数用约等号≈（数大小变了）"],"method":["读课本第12-13页（四舍五入），约8分钟","在白纸上完成10道四舍五入练习（精确到万位5道+精确到亿位5道），每道先标出保留位和判断位再操作，约7分钟","做黄冈小状元第9页练习，约5分钟"],"mastery":{"qualified":"能给任意大数正确四舍五入到指定数位，正确率>=80%","good":"正确率100%，且能说出每一步的决策（保留哪一位→看哪一位→为什么舍/入）","excellent":"能解释为什么需要近似数（人口统计、距离估算、预算估计），并举3个实际例子"},"examImpact":"高（8-12分）：近似数是小学数学贯穿四~六年级的核心技能，也是初中科学实验数据处理的基础。","examExample":"2024年浙江中考科学实验题：测得某物体长度为3.456cm，保留一位小数应为___cm。这就是四舍五入。","selfCheck":["230456四舍五入到万位约是多少？说明你的判断","17890000四舍五入到百万位约是多少？","改写和近似数有什么区别？用什么符号区分？","一个数四舍五入到万位约是20万，这个数最大可能是多少？最小可能是多少？","生活中什么时候用近似数就够了？举3个例子"]},{"title":"1亿有多大（综合探究）","kousuan":"第 8 页","huanggang":"探究活动（无对应页码）","knowledge":["探究目标：用已学的万亿知识结合生活中的事物，建立1亿的量感——1亿到底有多大？不是背数字，是感受它。","探究方向（选1-2个动手做）：1亿粒米有多重？数出100粒米称重→推算1亿粒米的重量；1亿张纸叠起来有多高？量100张纸的厚度→推算1亿张纸的高度→对比珠穆朗玛峰；数1亿下需要多长时间？计时数100下→推算数1亿下需要多少天","核心方法：化整为零——先测小数量（100/1000），再推算大数量（1亿）。这是科学研究中最基本的方法。"],"method":["选一个探究方向，准备材料（米+电子秤或A4纸+尺子或秒表），约3分钟","动手测量小样本：数100粒米称重/量100张纸厚度/计时数100下，记录数据，约8分钟","推算出1亿的结果，和生活中的大数做对比（如珠峰高度8848m、大象体重5吨），感受1亿有多大，约9分钟"],"mastery":{"qualified":"能完成一个探究项目并推算出正确结果","good":"推算过程正确且能用自己的话解释化整为零的方法","excellent":"能把1亿的结果和至少2个生活中的参照物做对比，让人一听就明白1亿有多大"},"examImpact":"中（3-5分）：中考不直接考1亿有多大，但化整为零是科学探究的核心方法。","examExample":"中考科学实验题：如何测量一张纸的厚度？标准答案是用刻度尺量100张纸的总厚度÷100=单张厚度。和今天你推1亿的方法一模一样。","selfCheck":["你选了哪个探究方向？100粒米/100张纸/数100下对应的数据是多少？","1亿的结果是多少？对比了什么参照物？","为什么不能直接数1亿粒米？我们用的什么聪明方法？","如果要你测1亿根头发丝的总长度，你会怎么测？","做完这个探究，你对1亿的感受和之前有什么不同？"]},{"title":"改写与近似数综合练习","kousuan":"第 9 页","huanggang":"第 10 页 + 复习 P8-9 错题","knowledge":["本周（Week 3）三大技能串联：改写——末尾全0时用等号=改写为万或亿；近似数——四舍五入到指定数位用约等号≈；量感——1亿=10000万=100000000","改写vs近似数核心区别：改写（等号=）数大小不变，只是换计数单位，要求末尾全是0。近似数（约等号≈）数大小改变，按四舍五入规则处理，不要求末尾全是0","典型错误预警：改写用错了符号（该用≈用了=）；四舍五入后忘记把后面的数字变成0；精确到万位时看成了千位（找错判断位了）"],"method":["翻看黄冈小状元第8-9页的错题，口述每道题的完整解题思路，约7分钟","在白纸上做混合练习：10道题包含改写（=）和近似数（≈），故意混在一起让孩子自己判断用哪个符号，约8分钟","做黄冈小状元第10页综合练习，约5分钟"],"mastery":{"qualified":"混合练习中能正确区分改写和近似数，正确率>=80%","good":"正确率100%，且能用一句话说清楚什么时候用=什么时候用≈","excellent":"能自己出3道混淆题（看起来像改写实际要近似，或反过来），并说明坑在哪"},"examImpact":"高（10-15分）：改写+近似数+大数读写+比较是第一单元期末考的四大考点组合拳。","examExample":"第一单元考试连环题：GDP数据→读出这个数→改写成亿作单位→四舍五入到百亿位。三道小问分别考察读写→改写→近似数。","selfCheck":["选出正确的符号：5000000改写成万用=还是≈？5001000四舍五入到万位用=还是≈？","把23450000改写成万作单位；把23450000四舍五入到百万位。两个答案一样吗？","一个数精确到万位约是30万，四舍五入前最大可能是？最小可能是？","改写和近似数——本周你错得最多的是哪种题型？为什么错了？","今天你想通了一个什么道理？用一句话总结"]},{"title":"第一单元冲刺复习（口算+错题）","kousuan":"第 10 页","huanggang":"复习 P1-10 错题本","knowledge":["第一单元完整知识体系（大数的认识）：计数单位与数位顺序表→读法→写法→比较→改写→近似数，共6大模块","错题分析工具：翻开错题本，每道错题问自己三个问题——我当时怎么想的？正确答案的逻辑链是什么？下次遇到类似的题我该先做什么？","口算提速策略：进位加法拆成整十数+余数（56+38=56+30+8=94）；退位减法拆成整十数-余数（73-47=73-40-7=26）；善用凑整——看到98想100-2"],"method":["口算限时挑战：5分钟25题（提速目标：比Week 1快10%），约5分钟","错题深度复盘：从Week 1-3所有错题中选3道最具代表性的，用三段式错题分析完整讲一遍，约10分钟","不看书画出第一单元思维导图（6大模块+每个的核心规则+最容易错的点），约5分钟"],"mastery":{"qualified":"口算速度>=16题/分钟；能画出第一单元6大模块的基本框架","good":"口算速度>=18题/分钟全对；错题复盘逻辑清晰；思维导图完整","excellent":"口算速度>=20题/分钟全对；能不看任何资料完整讲解第一单元任何一个知识点"},"examImpact":"极高（第一单元占期末15-20%）：第一单元是整个四年级数学的地基，这块不牢后面全是隐患。","examExample":"期末考试一道应用题里可能同时出现读数→比较→近似数→改写，你的全单元复习就是为这种连环题做准备。","selfCheck":["不看书画出第一单元思维导图（至少6个模块）","从你的错题中挑一道最经典的，完整讲解思路","口算计时：5分钟做了多少题？和Week 1比进步了吗？","第一单元你最有把握的是哪个模块？最没把握的打算怎么办？","如果用3句话给一个没学过的人讲清楚第一单元，你会讲哪3句？"]},{"title":"第一单元综合自测（查漏补缺）","kousuan":"第 11 页","huanggang":"第一单元达标卷","knowledge":["自测不是考试——不是为了打分，是为了找到我还不会什么。做错的地方恰恰是最值得学的地方。用平常心做，发现漏洞应该高兴。","自测范围（第一单元全部）：计数单位与数位→读法→写法→比较→改写→近似数。共6大模块，预计30-40道题","自测策略：先做会做的——遇到卡壳的跳过去，全部做完再回头想；每道题做完快速验算；做完统计每类题的正确率——找到薄弱模块"],"method":["口算热身：第11页20题限时5分钟，约5分钟","独立完成黄冈小状元第一单元达标卷（计时30分钟，模拟考试环境），约30分钟","自批自改：对照答案用红笔批改，每道错题在旁边写为什么错和正确做法，约10分钟"],"mastery":{"qualified":"达标卷正确率>=75%，能自己批改并标注错因","good":"正确率>=85%，每道错题能讲清楚错因和正确思路","excellent":"正确率>=92%，能自己分析第一单元最薄弱的2个模块并制定补强计划"},"examImpact":"极高（诊断价值大于分数）：单元自测的目的是精准定位薄弱点。今天发现的每一个漏洞，都用接下来两天的错题复盘来补上。","examExample":"中考学霸的共同习惯：每学完一个单元必做一次诊断性自测，然后花2-3天专门攻克暴露的薄弱点。从四年级开始养成这个习惯。","selfCheck":["达标卷整体感觉怎么样？哪个模块做得最顺手？哪个最卡？","批改后你的得分率是多少？失分最多的是哪种题型？","有没有哪道题是你觉得差一点就能做对的？差在哪一步？","从自测结果来看，你第一单元最需要加强的2个模块是什么？","做完自测你有什么想对自己说的？"]},{"title":"错题深度复盘","kousuan":"第 12 页","huanggang":"错题本专项复习","knowledge":["深度复盘vs简单订正：简单订正=抄正确答案（无效）。深度复盘=还原当时的错误思维→对比正确思维→建立防错规则→同类型题再练2道（验证真的会了）","错题分类法——把所有错题归入4类：知识盲区（真不会→回到课本重学）；理解偏差（以为懂了实际理解错了→用费曼法讲一遍）；操作失误（会做但步骤错了→建立操作检查清单）；粗心（看错数字/抄错/单位漏写→建立交卷前30秒检查清单）","典型错题模式（第一单元）：分级线画错位置；近似数用等号；改写时末尾有非0也改写；比较时只看前面数字忽略位数"],"method":["口算：第12页20题限时5分钟，约5分钟","错题分类：把昨天自测+之前所有第一单元的错题按四类分类，统计哪类最多，约8分钟","每类挑1道最典型的做深度复盘（4步法：还原→对比→建立规则→同类型再练），约12分钟"],"mastery":{"qualified":"完成错题分类统计，知道自己的主要失分类型是什么","good":"每道错题都完成了深度复盘的4个步骤，建立了至少1条防错规则","excellent":"能总结出自己的第一单元防错手册（至少3条规则），且同类型题再练全对"},"examImpact":"极高（决定学习效率）：同样做100道题，有深度复盘习惯的学生学到的东西是没有复盘习惯学生的3-5倍。","examExample":"中考高分生的错题本：每道错题旁边写了'我当时以为___，实际应该是___，区别在于___，下次先检查___'。你今天学的就是这种学霸级别的错题处理方式。","selfCheck":["你的错题中哪一类最多：知识盲区、理解偏差、操作失误还是粗心？","挑一道你认为最冤的错题——讲讲你是哪里拐错弯了","经过复盘，你建立了哪条防错规则？（至少说1条具体的）","同类型题再练的结果是什么？全部做对了吗？","你觉得错题复盘和简单订正最大的区别是什么？"]},{"title":"线段、直线、射线","kousuan":"第 13 页","huanggang":"第 11 页","knowledge":["三种线的定义与区别：线段——有两个端点，有限长，可以量出长度（如铅笔、桌边）；射线——有一个端点，另一端无限延伸，不可量长度（如手电筒的光）；直线——没有端点，两端无限延伸，不可量长度","对比表格：端点个数——线段2个/射线1个/直线0个。能否量长度——线段能/射线不能/直线不能。表示方法——线段AB/射线AB（端点在前）/直线AB","核心关系：线段是直线上两点之间的部分；射线是直线上一点把直线分成两部分；经过一点可以画无数条直线，经过两点只能画一条直线"],"method":["读课本第38-39页（线段/直线/射线），约7分钟","在白纸上画图并标注：画一条线段AB、一条射线CD（端点C）、一条直线EF；在一条直线上标出线段和射线的关系，约8分钟","做黄冈小状元第11页练习，约5分钟"],"mastery":{"qualified":"能正确画出线段、射线、直线并用字母标注，说出三者的端点数和能否量长度","good":"能在一张图上展示线段、射线、直线三者之间的关系","excellent":"能解释经过一点可以画几条直线？经过两点呢？并用图证明，进一步思考经过三点呢？"},"examImpact":"中高（5-8分）：线段/射线/直线的区分是角的度量单元的基础——角是由一个端点引出两条射线组成的。中考几何证明题中直线AB/射线AB/线段AB的表述是基本符号语言。","examExample":"中考几何第一问常考：如图，图中共有___条线段，___条射线，___条直线。这类题考察三种线的概念辨析。","selfCheck":["线段、射线、直线各有什么特点？用端点个数来区分","画一条线段AB，再把它向两端延长——变成了什么？只向一端延长呢？","经过一点可以画多少条直线？经过两点呢？画一画验证","为什么射线表示时要写成射线AB且A必须是端点？如果写成射线BA一样吗？","你身边有哪些东西可以看作线段？哪些可以看作射线？各举2例"]},{"title":"角的分类（锐角/直角/钝角/平角/周角）","kousuan":"第 14 页","huanggang":"第 12 页","knowledge":["角的定义：从一点引出两条射线所组成的图形叫做角。这个点叫顶点，两条射线叫边。角的大小与边的长短无关——和两边张开的大小有关！","五类角的标准：锐角（大于0度小于90度）；直角（等于90度，用直角符号标记）；钝角（大于90度小于180度）；平角（等于180度，两边成一条直线）；周角（等于360度，旋转一圈回到起点）","角度关系：1平角=2直角=180度；1周角=2平角=4直角=360度。锐角+钝角（如果拼成平角）=180度","易错点：角的大小不看边的长短；平角不是钝角！180度刚好是平角"],"method":["读课本第40-41页（角的分类），约7分钟","用两根筷子/吸管做角的模型：依次摆出锐角→直角→钝角→平角→周角，一边摆一边说出角度范围，约8分钟","做黄冈小状元第12页练习，约5分钟"],"mastery":{"qualified":"能正确区分五类角，说出每类角的角度范围","good":"能用筷子/吸管快速摆出任意指定的角，并说出它属于哪一类","excellent":"能在钟面上找出各类角（如3点=直角90度，6点=平角180度），并解释为什么"},"examImpact":"高（8-12分）：角的分类是四上期末考试核心考点（填空+判断+选择+画图四合一）。中考几何中角度的计算和证明完全建立在对角的概念和分类的理解之上。","examExample":"中考几何题常见表述：已知角A和角B互为补角（两角之和=180度），其中角A是锐角，则角B一定是___角。这道题的第一步就是判断：锐角<90度，所以角B=180度-锐角>90度，角B是钝角。","selfCheck":["说出五类角的名称和每类的角度范围","平角是一条直线吗？说说你的理解（提示：角需要顶点+两条射线）","钟面上3点整是什么角？6点整呢？12点整呢？","两个锐角拼起来一定小于180度吗？可能等于或大于吗？举例说明","用筷子摆角：妈妈说一个角的名字你快速摆出来——锐角！钝角！直角！平角！"]},{"title":"量角器使用入门","kousuan":"第 15 页","huanggang":"第 13 页","knowledge":["量角器的构造：中心点（量角器半圆底部正中间的小圆点）——要对齐角的顶点；0度刻度线（左右各一条）——要对齐角的一条边；内圈刻度和外圈刻度——从0度到180度，两个方向","量角三步法：点对点——量角器的中心点对齐角的顶点；线对边——0度刻度线对齐角的一条边；看刻度——角的另一条边指向的刻度就是角的度数。关键：读数时要看用的是内圈还是外圈——从哪边的0度开始数就用哪圈的刻度","易错点：量角器放反了——中心点和顶点没对齐；读错圈——该读内圈读了外圈（30度读成150度）；量角器歪了——0度刻度线和角的边没有完全重合"],"method":["认识量角器：用手指出量角器的中心点、0度刻度线（左右）、内圈刻度、外圈刻度，约5分钟","量角练习：在纸上画5个不同大小的角（含锐角、直角、钝角），用三步法逐一测量并记录度数，约10分钟","做黄冈小状元第13页练习，约5分钟"],"mastery":{"qualified":"能量出给定角的度数，正确率>=80%（关键：能区分该读内圈还是外圈）","good":"正确率100%，且能量出任意方向的角（角朝上、朝下、朝左、朝右）","excellent":"不仅能量角，还能用量角器画出一个指定度数的角（如画一个75度的角）"},"examImpact":"高（8-10分）：量角器操作是四上期末考试操作题的固定题型。中考数学尺规作图+科学实验中量筒/刻度尺读数都要求同样的精度习惯。","examExample":"2023年嘉兴中考科学实验题中量筒读数的评分标准：视线要与凹液面最低处齐平。你今天练的量角器三步法（对齐→看准→读对圈），就是所有科学仪器读数的基本功。","selfCheck":["量角器的中心点要对齐什么？0度刻度线要对齐什么？","量一个角时，怎么判断该读内圈还是外圈？说出你的判断方法","在纸上画一个角，用量角器量出它的度数。说说你的操作步骤","30度和150度在量角器上看起来很像——怎么避免读错？","如果量角器不在手边，你能用什么方法估一个角是不是90度？"]}],"science":[{"title":"空气能占据空间吗——概念引入","knowledge":["核心问题：空气看不见摸不着，它真的占据空间吗？我们怎么证明？","关键概念：占据空间 = 一个物体占了一个位置，别的物体就不能同时占那个位置。比如你坐在椅子上别人就不能同时坐同一把椅子——空气也是一样。","判断方法：如果有一个地方本来有空气我们把别的东西（如水）放进去空气被挤出来了就说明空气占了那个地方。反过来如果空气不让别的东西进去也说明它占据了空间。","复习上周：空气是无色无味透明的但它是一种实实在在的物质。上周我们用塑料袋装空气验证了它的存在这周要证明它占地方。"],"experiments":["回忆上周空瓶子入水实验——空瓶子倾斜放入水中冒气泡。气泡是什么？为什么水进去了气泡就出来了？这说明瓶子里原来有___，水把___挤出来了，所以空气___空间。","预习问题（先猜，明天动手验证）：如果用一个塑料杯杯底塞一团纸杯口朝下竖直压入水中——你觉得纸会湿吗？为什么？"],"mastery":{"qualified":"能说出占据空间的意思并给出 1 个生活中的例子","good":"能用「空气占据了空间所以___」的句式解释 2 个现象","excellent":"能设计一个简单的实验来证明空气占据空间（不翻书，自己想）"},"examImpact":"极高（贯穿初中理化）：八下物理大气压强全部建立在空气占据空间这个概念之上。如果这个概念没吃透大气压强那章基本只能背公式理解不了 WHY。","examExample":"中考科学必考题：为什么用排水法收集气体时气体能把水排出集气瓶？——标准答案的核心就是「气体占据空间将水排出」。你今天理解的「空气占地方」就是这道中考题的答案雏形。","selfCheck":["占据空间是什么意思？用你自己的话说","空瓶子放入水中冒气泡——这个现象说明了什么？","如果空气不占据空间空瓶子放入水中会发生什么？（想象题）","生活中有没有其他现象能证明空气占据空间？举例","如果把一个空杯子杯口朝下用力压入一盆水中杯子里的纸会湿吗？先猜猜看明天做实验验证"]},{"title":"空气能占据空间吗——塑料瓶压水实验","knowledge":["实验原理：塑料瓶里有空气当瓶口朝下压入水中时水想进入瓶子但空气堵在瓶口不让水进来——说明空气占据了瓶内的空间。","关键观察（拧盖 vs 开盖）：拧紧瓶盖时→水进不去（空气被关在瓶里占据了空间不让水进）；打开瓶盖时→空气从瓶口跑出来水立刻涌入瓶中取代了空气原来的位置。","结论：空气占据空间。拧盖实验证明「空气堵住了水」开盖实验证明「空气跑了水就进来了」——两个实验互相印证这就是对照实验的方法。"],"experiments":["实验准备：一个干净塑料瓶（矿泉水瓶即可）、一盆水、一支记号笔","实验一：拧盖压水（8 分钟）→ ①塑料瓶拧紧瓶盖 ②瓶口朝下竖直压入水中 ③观察瓶内水面位置——水面能上升到瓶口吗？为什么？④用记号笔在水面位置画一条线","实验二：开盖压水（8 分钟）→ ①同一个瓶子拧开瓶盖 ②瓶口朝下竖直压入水中 ③观察：水立刻涌入瓶中直到瓶内外水面齐平 ④思考：刚才拧盖时水进不去现在开盖水立刻进去了——中间发生了什么变化？","实验记录（三段式）：做了什么（拧盖+开盖对照实验）→ 看到什么（拧盖时水停在瓶口下方开盖时水立刻灌满）→ 说明什么（空气占据空间拧盖时空气被关在瓶里不让水进；开盖时空气跑了水就进来了）"],"mastery":{"qualified":"能正确完成两个实验并说出拧盖时水进不去是因为空气占了瓶里的空间","good":"能解释为什么开盖后水立刻进去了（说清因果关系：盖子打开→空气有出口→空气跑出去→水立刻填满空位）","excellent":"能把这个实验原理迁移到生活——举至少 1 个生活中类似的例子"},"examImpact":"极高（贯穿初中理化）：对照实验是中考科学实验探究的核心方法。2025 年浙江中考科学第 28 题（8 分实验探究大题）直接考察设计对照实验验证气体性质。你今天做的拧盖/开盖对照就是所有对照实验的启蒙版。","examExample":"中考科学实验探究题的评分标准：①能说出对照组和实验组的区别（2 分）②能解释观察到的差异（2 分）③能得出正确结论（2 分）④能提出改进方案（2 分）。你今天做的拧盖 vs 开盖就是在练习这 4 个能力。","selfCheck":["拧紧瓶盖压入水中水为什么进不去？用「因为……所以……」说清楚","打开瓶盖后发生了什么？为什么会这样？","如果瓶子底部戳一个小孔再拧紧瓶盖压入水中——会发生什么？为什么？（挑战题）","你生活中见过和这个类似的例子吗？（提示：游泳时把空桶扣入水中）","科学实验为什么要做对照？只做一个实验够不够？说说你的想法"]},{"title":"空气占据空间——深度探究与迁移","knowledge":["核心理解：空气占据空间不是静止的占据——空气可以被挤压（压缩）也可以跑出去（流动）。昨天的实验证明了两种状态：空气被关住时占据空间不让水进；空气有出口时就会跑掉水取而代之。","深度思考：如果瓶盖拧紧但我们在瓶底戳一个小孔再压入水中——瓶底的孔会让空气跑出去吗？水面会上升到什么位置？","生活应用：①潜水钟——倒扣的钟形容器沉入水中人可以在钟内呼吸因为钟内空气占据空间水进不来 ②水下捞硬币——杯子里的空气把水挡在外面 ③拔罐——加热后罐内空气膨胀跑掉冷却后气压变小皮肤被吸进去"],"experiments":["探究实验：瓶底戳孔（10 分钟）→ ①在塑料瓶底部用钉子戳一个小孔（家长帮忙）②拧紧瓶盖瓶口朝下压入水中 ③观察水面上升到什么位置？和昨天拧盖实验一样吗？④手指按住瓶底的孔→水面有什么变化？松开手指→又有什么变化？","挑战实验：水下捞硬币（10 分钟）→ ①在一盆水底放一枚硬币 ②用一个透明玻璃杯杯口朝下竖直扣入水中对准硬币 ③观察杯内水面为什么比杯外低？④试着不弄湿手把硬币取出来——能做到吗？原理是什么？","实验记录完成后和昨天对比——两个实验的共同点是什么？（都证明空气占据空间）不同点是什么？（证明方式不同）"],"mastery":{"qualified":"能完成瓶底戳孔实验并解释手指堵孔和松开的区别","good":"能完成水下捞硬币挑战并用自己的话解释为什么杯子里的水被压下去了","excellent":"能把今天和昨天的实验串联起来用自己的话总结空气占据空间的多种证明方法（至少 3 种）"},"examImpact":"高（实验探究+科学写作）：2024 年嘉兴中考科学第 27 题（6 分）给了倒扣杯子入水的示意图要求解释现象并设计验证实验。你今天做的就是这道中考题的动手版——做过实验考场上看到题目就像看到老朋友。","examExample":"中考科学实验探究题最爱考的题型：给你一个生活场景（如为什么潜水钟里的水不会灌满？）让你用科学原理来解释。满分答案 = ①点出核心概念（空气占据空间）②结合场景解释 ③补充限制条件。你今天把这三个层次都想清楚了考场上就是信手拈来。","selfCheck":["瓶底戳孔后压入水中水面为什么比昨天拧盖实验上升得更高？","用水杯在水中捞硬币——为什么杯子里的水面比外面低？","列举至少 3 种证明空气占据空间的方法","一个塑料瓶有 3 个地方可以控制空气进出：瓶口、瓶盖、瓶底孔。如果瓶盖拧紧+瓶底孔堵住→水___。如果瓶盖拧紧+瓶底孔松开→水___。如果瓶盖打开+瓶底孔松开→水___。","你今天学的空气占据空间和上周学的空气能被压缩有什么关系？它们是矛盾的还是互补的？"]},{"title":"空气占据空间——综合实验与应用","knowledge":["本周核心概念：空气是一种物质它占据空间。我们通过三种不同的实验方法验证了：①塑料袋抓空气（证明空气存在）②塑料瓶压水（拧盖/开盖对照）③水下捞硬币（空气把水排开）","系统总结——证明空气占据空间的 4 种方法：①挤压法（按压密封塑料袋感觉弹性）②排水法（空瓶/杯子倒扣入水水进不来）③排气法（拧盖→开盖→空气跑掉→水立刻进来）④应用法（潜水钟、拔罐、游泳圈）","科学思维进阶：一个好的科学结论需要多个实验交叉验证。只有一个实验证据可能是巧合；有 3-4 个不同方法得到相同结论才是可靠的。这就是为什么我们要做对照实验、重复实验。"],"experiments":["综合挑战：设计你自己的实验（15 分钟）→ ①目标：证明空气占据空间（但不能用这周已经做过的方法）②给你这些材料：气球、吸管、水槽、漏斗、橡皮泥——你能设计一个新实验吗？③画出实验设计图 ④动手试一试 ⑤写三段式实验记录","如果孩子无从下手提示：用漏斗往瓶子里灌水——如果把漏斗和瓶口之间用橡皮泥密封会怎样？不密封呢？","就算没成功也要写实验记录——科学家的实验有 90% 是失败的，重要的是能从失败中学到什么"],"mastery":{"qualified":"能说出至少 3 种证明空气占据空间的方法","good":"能自己设计一个新实验（哪怕没成功）并画出实验设计图","excellent":"实验设计成功且能清楚地写出我的实验证明了什么、为什么这个证据是可信的"},"examImpact":"高（科学思维 + 实验设计）：2025 年浙江中考科学新增实验设计题型（4-6 分）。给一个探究目标让你设计实验方案——恰好就是你今天做的事。中考不考你背过什么实验，考的是你能不能自己设计一个。从四年级开始培养到初三就是降维打击。","examExample":"中考实验设计题的评分标准：①实验目的明确（1 分）②有对照/重复设计（1 分）③步骤完整可操作（1 分）④能预测结果（1 分）⑤考虑了可能的误差/失败原因（1 分）。你今天的设计实验就是在无形的评分标准下练手。","selfCheck":["说出 4 种证明空气占据空间的方法","你设计的实验成功了吗？成功→它证明了什么？没成功→可能的原因是什么？","为什么科学家要做多个不同的实验来证明同一个结论？","如果有人说「空气不占据空间因为我看不见它」——你怎么用实验证据反驳他？","这周的科学实验和上周的有什么联系？如果让你向一个没上过课的同学解释空气是什么你会怎么说？（限 3 句话）"]},{"title":"空气单元阶段总结 + 自检清单第 14 题","knowledge":["前两周知识体系——单元一 空气：①1.1 感受空气（空气存在+性质：无色无味透明、占据空间、有质量、能压缩、能流动）②1.2 空气占据空间（三种验证方法：压水对照、戳孔控制、水下捞硬币）③空气与水的对比（颜色、气味、流动、压缩、质量、占据空间——6 个维度）","核心概念自查：你能不能一口气说出——空气的 5 个性质？证明空气存在的 3 种方法？证明空气占据空间的 4 种方法？空气和水最大的相同点？最大的不同点？","自检清单第 14 题：「设计一个实验证明空气占据空间。材料自选。请写出实验步骤、预测会看到什么现象、说明这个现象证明了什么。」——这是本周全部学习的终极检验。如果能在白纸上独立写出完整方案说明真的懂了。","预告下周：1.3-1.4 空气能压缩 + 空气有质量。注射器实验 + 简易天平称空气实验。数学进入改写与近似数。"],"experiments":["自检清单实战（15 分钟）→ 拿出一张白纸独立完成第 14 题：①写出实验名称 ②列出所需材料 ③写清楚每一步操作（让没做过的人也能照着做）④画出预期的现象（用图+文字标注）⑤写结论：这个现象说明了什么","完成后对照本周实验记录自我评价：我的实验设计——有对照吗？有重复吗？步骤够详细吗？预测和实际吻合吗？","如果时间允许：从本周 4 天的实验记录中选出写得最好和写得最不好的——比较一下差别在哪？以后怎么写会更好？"],"mastery":{"qualified":"能独立完成自检清单第 14 题实验设计基本完整（有材料、有步骤、有预测）","good":"实验设计有对照、步骤详细、预测合理给一个没学过的人看也能跟着做出来","excellent":"不仅完成第 14 题还能指出自己设计中可能存在的问题或改进空间（自我反思）"},"examImpact":"极高（科学素养的核心）：科学教育的终极目标不是记住了多少知识而是能不能像科学家一样思考——提问题→猜答案→做实验→得结论→反思改进。登峰计划面试特别喜欢问：你做过什么实验？你是怎么设计的？遇到了什么困难？——你今天积累的经验就是面试时最好的回答素材。","examExample":"登峰计划面试常见问题：请设计一个实验来验证____。考官不是要听你背课本实验而是要看你是否具备科学思维——逻辑清晰、能考虑变量控制、能预判误差。你今天在白纸上独立设计的实验方案就是登峰面试的模拟练习。","selfCheck":["不看书一口气说出空气的 5 个性质","自检清单第 14 题：独立完成实验设计（写在一张白纸上）","对照你的实验设计——有哪一步可能做不出来？如果做不出来备选方案是什么？","这周的科学课你最喜欢哪个实验？为什么？最不喜欢哪个？为什么？","如果让你给下周的自己写一句话关于空气这个单元你会写什么？"]},{"title":"空气能压缩吗——注射器实验","knowledge":["核心问题：空气能被压缩吗？如果能，为什么？怎么证明？","关键概念：压缩=通过外力把物质压到更小的空间里。空气能被压缩是因为空气分子之间的间隙很大，可以挤得更近。水几乎不能被压缩是因为水分子之间间隙极小。","实验原理：注射器里封住一段空气→推动活塞→空气被压缩→活塞可以推进一段距离（因为有间隙）。如果注射器里是水→推动活塞→水几乎不能被压缩→活塞几乎推不动。这就是对照实验。","与前面知识的连接：空气占据空间不等于空间不能变小。空气占据的空间可以变小（压缩），但不会消失。水占据的空间几乎不能变小。"],"experiments":["实验一：空气压缩实验（10分钟）→ 用一支5ml注射器（无针头）拉到5ml刻度处，用手指堵住注射器出口→用力推动活塞，能推进去吗？推进了多少？→松开手，活塞有什么变化？→结论：空气能被压缩，松手后压缩的空气会弹回来","实验二：水压缩对照实验（10分钟）→ 同一支注射器吸入5ml水，用手指堵住出口→用力推动活塞，和推空气时感觉一样吗？推进去了多少？→结论：水几乎不能被压缩","实验记录（三段式）：做了什么（注射器分别装空气和水的压缩对照实验）→看到了什么（装空气时活塞能推进去，装水时几乎推不动）→说明了什么（空气能被压缩是因为分子间隙大，水极难被压缩是因为分子间隙小）"],"mastery":{"qualified":"能完成注射器实验并说出空气能被压缩、水极难被压缩","good":"能解释为什么空气能被压缩而水不能（用分子间隙的概念解释）","excellent":"能举出生活中利用空气可压缩性的例子并解释原理（轮胎打气、篮球弹跳、气垫鞋）"},"examImpact":"极高（贯穿初中理化）：八下物理大气压强+气体定律全部建立在此概念上。九上化学气体收集方法也以此为基础。","examExample":"中考科学实验题：用注射器验证空气能被压缩。请写出实验步骤；预测会看到什么现象；如果换成装水结果会怎样？为什么？你今天做的注射器对照实验，就是这道中考题的预演。","selfCheck":["推装有空气的注射器和装水的注射器——感觉有什么不同？","为什么空气能被压缩而水不能？用你自己的话解释","松手后压缩的空气为什么弹回来？这说明空气除了能被压缩还有什么性质？","生活中有什么东西用到了空气能被压缩这个性质？举2例","如果注射器里装的是沙子，你觉得能压缩吗？为什么？猜一猜再动手试试"]},{"title":"压缩空气的应用（篮球/轮胎/气垫）","knowledge":["核心理解：压缩空气的力量——当空气被压缩在一个很小的空间里时，它想回到原来的体积，所以会产生向外的推力。这个推力可以被我们利用。","生活应用与原理：篮球/足球——打气时把更多空气压进球胆，球内压缩空气产生向外的压力，球变硬、弹性好。气打得越足，球弹得越高。自行车/汽车轮胎——内胎里充满压缩空气，支撑车身重量。气垫鞋——鞋底气垫里封着压缩空气，踩下去时压缩空气被进一步挤压，抬脚时回弹——这就是缓震的原理","核心规律：同一个密闭空间里，空气被压缩得越厉害（体积越小），产生的向外推力就越大。这就是为什么气打得越足的球弹得越高。"],"experiments":["体验实验：不同气压的球（10分钟）→ 找一个篮球/足球，先放掉一半气，拍一拍感觉弹跳高度→打满气，再拍一拍→比较两次弹跳高度和手感→结论：气越足（空气压缩越厉害），弹跳越高","拓展观察（10分钟）：观察自行车轮胎上的气压标识（如40-65 PSI）——这个数字就是推荐的压缩空气压力值；如果有气垫鞋，观察气垫窗口，按压感受回弹；用注射器实验回顾——注射器里的空气被压缩后松手弹回来，和球弹跳是一个原理","实验记录重点关注：被你压缩的空气想要弹回原来的体积——这就是弹性/反弹力的来源"],"mastery":{"qualified":"能说出至少2种压缩空气的应用并简单解释原理","good":"能用压缩空气产生向外推力这个概念统一解释篮球弹跳、轮胎承重、气垫缓震","excellent":"能自己发现生活中其他利用压缩空气的例子并分析原理（如喷壶、气枪、气动工具）"},"examImpact":"高（5-8分）：中考物理选择题和填空题常出现下列现象中利用空气可压缩性的是或解释篮球弹跳的物理原理。","examExample":"2024年浙江中考科学第5题（3分）：下列现象与空气能被压缩有关的是：A.扇扇子有风 B.篮球弹跳 C.空瓶入水冒气泡 D.热气球升空。正确答案是B——A是空气流动，C是空气占据空间，D是热空气密度变小。四个选项分别对应空气的四个不同性质。","selfCheck":["为什么打足气的篮球比没气的篮球弹得高？用压缩空气来解释","自行车轮胎的气压标识是什么意思？气压不够了会怎样？","气垫鞋为什么踩着软软的？里面的空气在做什么？","除了球和轮胎，你能再想一个利用压缩空气的例子吗？","如果让你设计一个利用压缩空气的玩具，你会设计什么？"]},{"title":"空气有质量吗——简易天平实验","knowledge":["核心问题：空气看不见摸不着，它到底有没有质量？怎么称？","关键概念：质量是物体所含物质的多少——跟体积、形状、位置无关。空气是一种物质（前面已经证明了它存在、占据空间、能被压缩），所以空气应该有质量。但它的质量非常小，需要精确的方法才能测出来。","实验原理：用简易天平（或衣架天平）——两边各挂一个气球/皮球，先平衡→给一边的球打气（增加了空气）→看天平是否倾斜。如果打气的一边下沉，说明增加空气增加了质量→空气有质量。","对照思维：为什么要用两个一模一样的球？为了排除球本身重量的影响——变量只有一个：有没有额外增加空气。这就是孩子第一次接触控制变量法。"],"experiments":["制作简易天平（5分钟）→ 找一个衣架，在两端用绳子各挂一个纸杯/塑料袋→调整绳子位置使衣架平衡→这就是一个简易天平","空气有质量实验（15分钟）→ 在两个纸杯/袋子中放入两个一模一样的气球（都没吹气的）→调整天平平衡→取出一个气球吹大扎紧（增加了空气），另一个不动作为对照→把两个气球分别放回纸杯→观察天平向哪边倾斜？→结论：吹了气的气球更重→证明空气有质量","替代方案（如果没有气球）：用一个皮球，先放掉所有气→称重或天平平衡→用打气筒打足气→再称重或放回天平→比较。实际上用电子秤更直观（如果家里有厨房秤精度到1g的话）"],"mastery":{"qualified":"能完成实验并得出空气有质量的结论","good":"能解释对照实验的设计——为什么要用两个一模一样的气球？为什么先平衡再吹气？","excellent":"能用控制变量法的思想来评价自己实验的可靠性，并提出可能的改进方案"},"examImpact":"极高（贯穿初中理化）：八下物理大气压强的存在就是建立在大气有质量这一事实之上——空气有质量所以受重力所以有大气压。","examExample":"中考科学实验评价题：小明用天平称了一个没打气的皮球和一个打足气的皮球，发现重量几乎一样，于是说空气没有质量。请指出小明实验中的问题并提出改进方案。——答案：皮球本身重量远大于空气重量，天平精度不够；改进：用更精确的电子秤，或把皮球换成很轻的气球。","selfCheck":["你的实验结果是——空气有质量还是没有质量？","为什么实验要用两个一模一样的气球？只用一个气球称打气前和打气后行不行？","如果实验结果不明显（天平几乎没动），可能的原因是什么？怎么改进？","空气有质量和我们之前学的空气占据空间有关系吗？是矛盾的还是互相补充的？","为什么我们感觉不到空气的重量？——空气在你身上有压力，为什么没把你压扁？"]},{"title":"称一称空气有多重","knowledge":["核心探究：昨天的实验只证明了空气有质量——是/否的问题。今天要追问：空气到底有多重？（定量探究）我们要学会用数据说话，从有/没有升级到有多少。","数据推算：先称100下打气筒打入的空气增加的重量（用精确电子秤）；算出1下打气筒打入的空气质量；推算：你房间里的空气大概有多重？参考数据：1立方米空气约重1.29千克（约等于一大瓶可乐的重量），一个普通卧室（20平方米x2.5米高=50立方米）里的空气约重64.5千克——相当于一个成年人的体重！","量感建立：空气确实很轻——但很轻不等于没重量。1升空气约重1.29克（约1颗花生米的重量）。一大袋空气（1立方米）就有1.29千克。量的积累会导致质的感受。"],"experiments":["定量探究（如家中有厨房秤精度1g）：称一个放完气的皮球，记录重量→用打气筒打50下气，再称重量→增加的重量÷50=每下一次打气打入的空气质量→结论：每打一次气约增加多少g的空气","推算挑战（10分钟）：测量你房间的大致长宽高（用步测或卷尺），算出房间体积→已知1立方米空气约1.29kg→房间里的空气总重量→对比：相当于几瓶大可乐？","没有精确秤的替代方案：直接用前面的数据做计算练习。重点是让孩子经历测量→计算→推理→发现规律这个过程"],"mastery":{"qualified":"能说出1立方米空气约重1.29千克并完成房间空气重量的推算","good":"能独立完成定性到定量的探究——从实验数据推算出一个有意义的结果","excellent":"能解释为什么我们感受不到这么大重量的空气压在身上（因为身体内外气压平衡，且从小适应了）"},"examImpact":"中（3-5分）：中考科学中的估测题常考察学生对常见物理量的数量级感觉。如一间教室里的空气质量大约是多少？——知道1立方米空气约1.29kg就能快速估算。","examExample":"中考科学估测选择题：一间普通教室里的空气质量最接近：A.2.5kg B.25kg C.250kg D.2500kg。——教室约200立方米，200x1.29≈258kg，最接近250kg选C。没有量感就靠蒙。","selfCheck":["你测出/推算出每打一次气大约增加多少克空气？","你的房间里的空气大约有多重？相当于几瓶大可乐？","1立方米的空气重约1.29千克——你觉得这个数字是重还是轻？为什么？","如果把教室里的空气全部抽走，会发生什么？（挑战想象题）","从空气有质量吗到空气有多重——你经历了怎样的思维升级？"]},{"title":"空气单元复习（性质+占据空间+压缩+质量）","knowledge":["空气单元完整知识体系（1.1-1.4）：性质——空气无色无味透明，是一种实实在在的物质；占据空间——通过压水实验、水下捞硬币等4种方法验证；能压缩——注射器实验证明空气可压缩（分子间隙大），水极难压缩；有质量——简易天平实验证明，1立方米约1.29kg","四大性质之间的联系：都是因为空气是一种物质→物质占据空间→物质的分子间有间隙（所以能被压缩）→物质有质量（所以被地球引力吸引产生重量）——这四个性质不是孤立的，是空气是物质这个根本事实的四个方面","与水的系统对比：颜色（空=无色/水=无色）、气味（空=无味/水=无味）、占据空间（都是）、质量（都有）、能否压缩（空=能/水=极难）、能否流动（都是）——相同点4个，不同点1个。为什么只有压缩不同？因为水和空气的分子间距不同"],"experiments":["思维导图构建（10分钟）→ 在白纸中央写空气，向外画出4个分支：性质（无色无味透明）→占据空间（4种验证方法）→能压缩（注射器实验+生活应用）→有质量（天平实验+数据）。每个分支再往下展开至少2个子要点","口头费曼（10分钟）→ 假装要给妹妹讲空气是什么，用最通俗的话讲清楚：空气存在吗？怎么证明？空气占地方吗？怎么证明？空气能被压缩吗？怎么证明？空气有重量吗？怎么证明？——如果中间卡住了，回去看实验记录再讲一遍","自检清单预演：对着自检清单第13-18题，自己先口答一遍，卡住的做好标记"],"mastery":{"qualified":"能画出空气单元4大模块的思维导图，每个模块至少1个要点","good":"能用通俗的语言给妹妹讲清楚空气的4大性质，中间不卡壳","excellent":"能说清4大性质之间的逻辑关系——它们不是4个独立的知识点，而是空气是物质的4个侧面"},"examImpact":"极高（单元收关）：空气单元是四上科学第一个完整单元，也是初中理化物质性质的认知基础。现在把4大性质之间的逻辑关系理顺，到初二就是秒懂。","examExample":"中考科学综合性大题：请从空气是物质这一根本事实出发，解释以下三个现象：空瓶子压入水中水进不去；篮球打气后变硬；大气压强的存在。三个现象分别对应占据空间、可压缩、有质量——全部从一个根本事实推导出来。","selfCheck":["不看书画出空气单元思维导图（4大模块+每个至少2个要点）","用最通俗的话给妹妹讲：空气存在吗？你怎么证明？","自检清单第13-18题，哪道你觉得最有把握？哪道还卡？","空气的4大性质之间有什么联系？它们都说明了一个什么根本事实？","这个单元你最大的收获是什么？不是知识点——是你学到了什么学习方法或想通了一个什么道理？"]},{"title":"空气流动有力量——气球小火箭","knowledge":["核心问题：空气流动时有没有力量？怎么证明？这个力量从哪来？","关键概念：空气在流动时具有动能——就像水流能推动水车，流动的空气也能推动物体；反冲原理——当你把空气（或其他东西）往一个方向推出去时，你自己会受到相反方向的力。这就是为什么气球放气时会乱飞——喷出的空气往一个方向跑，气球本身被推向反方向","与前面的连接：空气占据空间→空气能被压缩（气球吹大=气球里的压缩空气）→压缩空气想回到原来的体积→打开气球口→空气喷涌而出（流动）→产生反冲力→气球飞走。每一个环节都用到了前面学的知识","生活例子：喷气式飞机——向后喷出高速气体，飞机向前飞；火箭升空——向下喷射火焰和气体，火箭向上飞；水管喷水时水管往后推——同样原理但介质是水"],"experiments":["实验一：感受流动空气的力量（5分钟）→ 用力吹一口气在手掌上——感觉到了什么？→用吸管吹一个小纸团——纸团怎么了？→结论：流动的空气有力量，能推动物体","实验二：气球小火箭（15分钟）→ 吹一个气球扎紧口→在气球上贴一根吸管（用胶带）→穿过一根拉直的细绳（约3-5米长，从房间一头拉到另一头）→把气球拉到绳子一端，松开气球口→观察气球沿着绳子飞速滑向另一端→这就是反冲力！气球喷出的空气向后→气球本身向前","实验记录：做了什么（气球火箭实验）→看到了什么（气球沿绳飞出去，喷出的空气往反方向）→说明了什么（流动的空气有力量，喷出空气时产生反冲力推动气球前进）"],"mastery":{"qualified":"能完成气球小火箭实验并说出流动的空气有力量","good":"能用反冲力解释气球为什么会往喷气反方向飞","excellent":"能把反冲原理迁移到喷气式飞机和火箭的解释上，并指出和气球火箭的相同点和不同点"},"examImpact":"中（3-5分）：中考物理中反冲/作用力与反作用力是牛顿第三定律的内容。四年级通过气球火箭建立的直观体验，到初二正式学牛顿第三定律时就是直觉先行，公式后学。","examExample":"中考物理常见题型：下列现象中，利用反冲原理的是：A.人走路 B.火箭升空 C.苹果落地 D.磁铁吸铁。答案是B。你今天的实验让你不用背——因为你知道气球怎么飞，就知道火箭怎么飞。","selfCheck":["气球火箭为什么往前飞？喷出的空气往哪个方向？气球往哪个方向？","如果气球吹得更大，飞得更远吗？为什么？试一下","你吹一口气在手上——感觉到了什么？这说明什么？","喷气式飞机和气球火箭有什么一样的地方？有什么不一样？","如果让你设计一个更快的气球火箭，你会怎么改进？"]},{"title":"热空气和冷空气——热气球实验","knowledge":["核心问题：空气受热和受冷后有什么变化？这些变化会导致什么有趣的现象？","关键概念：热胀冷缩——空气受热后体积膨胀（分子运动变剧烈，占更大空间），受冷后体积收缩；密度变化——同样体积的热空气比冷空气轻（因为热空气膨胀→同样空间里分子变少了→质量变小→密度变小）→所以热空气上升","与前面知识的串联：空气占据空间→空气能被压缩→空气有质量→空气受热膨胀（密度变小，变轻）→热空气上升（轻的东西浮在重的东西上面）→冷空气下降→形成对流","生活观察：空调为什么装在上面？——冷空气重，从上往下沉；暖气为什么装在下面？——热空气轻，从下往上升；烟囱为什么烟往上冒？——燃烧产生的热空气往上走"],"experiments":["实验一：瓶口气球——热胀冷缩直观演示（10分钟）→ 在空塑料瓶口套一个气球→把瓶子放入热水中（约60度，注意安全）→观察气球慢慢鼓起来→把瓶子放入冷水中→观察气球慢慢瘪下去→结论：空气受热膨胀（气球鼓起来），受冷收缩（气球瘪下去）","实验二：自制迷你热气球（15分钟）→ 找一个很轻的塑料袋（超市购物袋那种薄的）→在袋口下方用吹风机（热风档）往上吹热风（注意保持距离，不要太近以免熔化）→观察塑料袋慢慢鼓起来并上升→关掉吹风机→塑料袋慢慢下降→结论：热空气比冷空气轻，所以上升","实验记录：用三段式记录两个实验的观察和结论。特别注意——瓶口气球实验说明热胀冷缩（体积变化），热气球实验说明热空气上升（密度/轻重变化）。两个实验讲的是同一件事的两个方面"],"mastery":{"qualified":"能完成实验并说出空气受热膨胀、受冷收缩","good":"能解释为什么热空气会上升（热空气膨胀→密度变小→比冷空气轻→上升）","excellent":"能用热空气上升+冷空气下降解释生活中至少3个现象（空调装上方、暖气装下方、烟往上冒、孔明灯）"},"examImpact":"高（5-10分）：热胀冷缩+热空气上升是四上科学核心考点，也是八上物理物态变化与热传递的基础。中考地理中大气环流（风、气压带）的理解也建立在这个概念之上。","examExample":"中考科学综合题：请用热传递和密度知识解释：冬天的暖气片为什么通常安装在窗户下方？标准答案——暖气片加热周围空气→热空气密度变小→上升→冷空气下降补充→形成对流循环→整个房间变暖。","selfCheck":["瓶子放在热水里，瓶口的气球发生了什么变化？为什么？","热空气为什么上升？冷空气为什么下降？用你理解的话解释","家里的空调为什么装在房间上方？暖气为什么装在下方？","如果不用吹风机，你能让塑料袋自己飘起来吗？（提示：大太阳底下...）","孔明灯（天灯）是什么原理？它和今天的哪个实验一样？"]},{"title":"风的成因","knowledge":["核心问题：自然界的风是怎么形成的？风的方向是由什么决定的？","风的形成机制（三步推导）：太阳照射地面→地面受热不均（有些地方热有些地方冷）→热的地方地面加热上方空气→空气受热膨胀上升→该区域近地面气压降低→周围冷空气（气压高的地方）流过来补充→空气水平流动=风。一句话总结：风是空气从冷的地方（气压高）流向热的地方（气压低）形成的。","关键理解：风=空气的水平流动（垂直方向的是上升/下沉气流，不是风）；风的根本原因是地面受热不均（太阳是风的终极能源）；风的方向——从冷（高压）吹向热（低压）","知识串联图：太阳→地面受热不均→热空气上升+冷空气下降→气压差异→空气水平流动→风。每一个箭头都对应一个前面学过的概念"],"experiments":["模拟实验：风的成因演示盒（15分钟）→ 找一个鞋盒，在一侧下方剪一个小孔（进气口），在另一侧上方剪一个小孔（出气口）→在出气口上方贴一张薄纸条（如便签纸）→在鞋盒内靠近进气口处放一支点燃的蜡烛（注意防火！家长陪同下操作）→观察纸条有没有飘动？往哪个方向？→结论：蜡烛加热盒内空气→热空气上升从出气口出去→盒内气压降低→外部冷空气从进气口被吸进来→形成气流，纸条飘动说明有风","如果没有鞋盒/蜡烛的简化版（5分钟）：在厨房灶台附近（关火后有余热）用薄纸感受上升的热气流→在冰箱冷冻室打开门时感受冷空气往下沉→同时感受两处的气流方向","实验记录：画出鞋盒实验的气流方向图（用箭头标注冷空气从哪里进、热空气从哪里出）"],"mastery":{"qualified":"能说出风是空气水平流动，因为有些地方热有些地方冷","good":"能完整解释风的形成三步推导并用箭头画出示意图","excellent":"能用风的成因解释海陆风（白天和晚上风向为什么相反）或山谷风"},"examImpact":"高（6-10分）：风的成因是四上科学核心概念，初中地理大气环流/季风的根本原理也源于此。中考科学中解释自然现象题型必考。","examExample":"中考科学材料分析题：长沙夏季白天常吹南风（从湘江吹向市区），请根据所学知识解释原因。——标准答案思路：白天陆地比水面热得快→陆地上方空气受热上升→陆地近地面气压降低→江面上方相对冷的空气流过来补充→形成从江面吹向陆地的南风。","selfCheck":["风是什么？用一句话定义","风形成的三步推导：太阳→？→？→风。填上中间两步","为什么白天海边风从海吹向陆地，晚上反过来？","鞋盒实验中，如果蜡烛放在出气口下方纸条还飘吗？为什么？","如果没有太阳（比如阴天），还会有风吗？说说你的推理"]},{"title":"空气单元总复习 + 家庭课题#1（不同水温冰糖溶解速度）","knowledge":["空气单元完整收官——6大知识点串联：空气存在与性质（无色无味透明）→占据空间（4种验证方法）→能被压缩（分子间隙大vs水不能压缩）→有质量（1立方米约1.29kg）→流动有力量（反冲力，气球火箭）→热空气上升冷空气下降（热胀冷缩→密度变化→风=空气流动）。6个知识点不是孤岛，全部由空气是一种物质推导出来","家庭课题#1介绍：这是一个完整的科学研究——从提出问题到得出结论，全部由孩子自己完成（家长只帮忙准备材料和安全监督）。课题：不同水温下冰糖溶解速度一样吗？","研究流程（科学方法完整版）：提出问题（不同水温冰糖溶解速度一样吗？）→做出假设（热水溶解更快？）→设计实验（用什么材料？怎么操作？怎么记录？）→动手实验（计时+观察+记录）→分析数据（画表格或画图对比）→得出结论（假设对不对？为什么？）→反思改进（如果重做会怎么改进？）"],"experiments":["空气单元费曼总讲（10分钟）→ 给妈妈/妹妹完整讲一遍空气单元6大知识点。要求：不能看书；用最通俗的话；每个知识点都要有例子或实验证据；6个知识点之间的逻辑关系要说清楚。妈妈听完提问至少2个问题检验理解深度","家庭课题#1：不同水温冰糖溶解速度（20分钟）→ 准备3个透明杯，分别倒入等量（如200ml）的冰水、常温水、热水（约50-60度，注意安全）→各放入一颗大小相近的冰糖→同时开始计时→每隔1分钟观察并记录冰糖的变化（可以用手机拍照）→记录每杯冰糖完全溶解所用的时间→在纸上画表格整理数据→得出结论：水温越高，冰糖溶解越快。为什么？因为热水分子运动更剧烈，更容易撞碎冰糖的分子结构","课题记录要求（完整科学报告格式）：题目、假设、材料、步骤、数据（表格）、结论、反思。这是孩子第一份正式的科学研究报告——保留好，将来登峰面试是素材"],"mastery":{"qualified":"能完成空气单元费曼总讲（6大知识点不漏）和家庭课题实验","good":"费曼总讲逻辑清晰，家庭课题有完整的实验记录（含表格数据）","excellent":"费曼总讲有逻辑链条（不是背6个知识点而是讲它们之间的关系），家庭课题报告格式完整（7个环节全有），且能提出至少1条合理的改进建议"},"examImpact":"极高（综合能力检验）：空气单元总复习直接对应四上科学第一单元测试（约占总分25%）；家庭课题训练的是中考科学实验探究大题的完整能力。","examExample":"中考科学实验探究题评分标准的7个维度：问题明确、假设合理、变量控制（你用了等量水+同样大小的冰糖——这就是控制变量！）、步骤完整、数据记录规范、结论与证据匹配、反思合理。你今天完成的家庭课题，就是这7个维度在生活中的第一次完整实践。","selfCheck":["不看书把空气单元6大知识点串联讲一遍（注意说清它们之间的关系）","家庭课题#1：不同水温下冰糖溶解速度一样吗？你的假设是什么？实验结果是什么？","为什么热水溶解冰糖更快？用你自己的话解释（提示：分子运动）","你的实验中控制了哪些变量？（哪些东西要保持一样）如果不控制变量实验还可靠吗？","如果让你重做这个实验，你会怎么改进？至少提1条具体建议"]}]};

const SELF_CHECK_QUESTIONS = [{"id":1,"phase":"三下","question":"不用指南针，给你一片空地，有太阳，你能说出东南西北吗？","answer":"太阳东升西落。面朝东方（太阳升起的方向），右手边是南，左手边是北，背后是西。"},{"id":2,"phase":"三下","question":"北极星怎么找？除了太阳和北极星，说出至少 2 种辨别方向的方法。","answer":"用北斗七星找北极星（北斗七星\"勺口\"两颗星连线延长约 5 倍距离指向北极星）。其他方法：①树木年轮疏密（疏=南，密=北）；②树叶茂密程度（茂密一侧=南）；③苔藓茂盛方向（北侧）；④冬季雪融化快慢（南侧快、北侧慢）。"},{"id":3,"phase":"三下","question":"磁铁的南极和北极是怎么定义的？为什么自由转动的磁铁总指向南北？","answer":"自由旋转的磁铁指向南方的一端叫南极（S），指向北方的一端叫北极（N）。因为地球本身是一个大磁体，有地磁场。"},{"id":4,"phase":"三下","question":"脊椎动物和无脊椎动物的区别是什么？各举 3 例。","answer":"身体内有脊柱的动物 = 脊椎动物（鱼、鸟、猫/狗/人等哺乳类）；身体内没有脊柱的动物 = 无脊椎动物（昆虫、蜗牛、蚯蚓）。"},{"id":5,"phase":"三下","question":"卵生和胎生的区别？人是哪种？","answer":"卵生：产卵繁殖后代（昆虫、鸟类、鱼类、蚕）。胎生：直接生下小动物并用乳汁喂养（猫、狗、人类）。人是胎生。"},{"id":6,"phase":"三下","question":"蚕的一生经历哪几个阶段？蜕 4 次皮中间那个\"不吃不动\"的阶段叫什么？","answer":"卵 → 幼虫（蚕宝宝/蚁蚕）→ 蛹 → 成虫（蚕蛾），共四个阶段，约 56 天。蜕皮前不吃不动的阶段叫\"眠\"，从蚁蚕到结茧前共蜕 4 次皮。"},{"id":7,"phase":"三下","question":"完全变态发育和不完全变态发育的区别？分别举 2 种昆虫。","answer":"完全变态发育：卵→幼虫→蛹→成虫（4 个阶段），如蚕、蝴蝶、苍蝇、蚊子。不完全变态发育：卵→幼虫→成虫（3 个阶段，无蛹期），如蜻蜓、蝗虫。"},{"id":8,"phase":"三下","question":"地球表面海洋和陆地的大致比例是多少？淡水占全球总水量的多少？","answer":"海洋约占 71%，陆地约占 29%（三分陆地、七分海洋）。地球总水量中约 97.5% 是咸水，仅约 2.5% 是淡水，其中约 70% 的淡水以两极冰川形式存在。可供人类直接饮用的地表淡水不足全球总水量的 1%。"},{"id":9,"phase":"三下","question":"月球和地球比，为什么月球上没有生命？（至少说 3 个条件缺失）","answer":"①月球表面没有液态水；②月球没有大气层；③月球昼夜温差极大（白天 > 120°C，夜间 < -180°C）。"},{"id":10,"phase":"三下","question":"太阳是恒星还是行星？太阳系八大行星由近到远排列。","answer":"太阳是恒星（也是太阳系的中心天体）。八大行星由近到远：水星 → 金星 → 地球 → 火星 → 木星 → 土星 → 天王星 → 海王星。（口诀：水金地火木土天海）"},{"id":11,"phase":"三下","question":"影子的方向一天中怎么变？长短怎么变？为什么？","answer":"影子方向变化：西 → 北 → 东（与太阳方向相反）。影子长短变化：长 → 短 → 长（早上长，中午最短，傍晚又变长）。因为太阳高度角变化——太阳低时影子长，太阳高时影子短。"},{"id":12,"phase":"四上","question":"环形山是怎么形成的？越大的陨石砸出来的坑越___？","answer":"环形山是陨石撞击月球表面形成的。撞击球越大、高度越高，形成的\"环形山\"越大、越深。"},{"id":13,"phase":"四上","question":"怎么证明空气存在？至少说 3 个方法。","answer":"①用塑料袋装空气，按压有弹性，说明里面有东西；②空瓶子倾斜放入水中，有气泡冒出；③扇扇子感觉有风（空气流动）；④粉笔放入水中冒气泡（粉笔孔隙中有空气）。"},{"id":14,"phase":"四上","question":"空气占据空间吗？空气有质量吗？怎么证明？","answer":"空气占据空间：拧紧瓶盖竖直压入水中，水无法进入瓶内（空气占据了瓶内空间）。空气有质量：用简易天平，给一端皮球打气后，天平向打气端倾斜，说明空气有质量。"},{"id":15,"phase":"四上","question":"空气和水，谁能被压缩？为什么？","answer":"空气能被压缩，水极难被压缩。因为空气分子之间间隙很大，可以被挤压靠近；水分之间间隙极小，几乎无法再靠近。"},{"id":16,"phase":"四上","question":"注射器实验：压活塞时，空气分子间距变___，所以能被压缩。","answer":"小（空气分子被挤压靠近，占据的空间缩小）。"},{"id":17,"phase":"四上","question":"自然界中的风是怎么形成的？","answer":"地面受热不均 → 热空气上升 → 该区域气压降低 → 周围冷空气流过来补充 → 空气水平流动形成风。核心：空气从冷的地方流向热的地方。"},{"id":18,"phase":"四上","question":"热气球为什么能上升？","answer":"热空气受热后体积膨胀，密度变小（比周围冷空气轻），所以上升。降温后密度变大，下降。"},{"id":19,"phase":"四上","question":"人呼吸时空气经过哪些器官？气体交换主要在哪个器官进行？","answer":"路线：鼻腔 → 气管 → 肺。气体交换（氧气进入血液、二氧化碳排出）主要在肺中进行。"},{"id":20,"phase":"四上","question":"肺活量是什么？运动后呼吸为什么会加快？","answer":"肺活量 = 一次尽力吸气后，再尽力呼出的气体总量。运动时人体消耗更多氧气，需要呼吸加快加深，使肺部气体交换速度加快以吸入更多氧气、排出更多二氧化碳。"},{"id":21,"phase":"四上","question":"人的消化系统路线：口→___→___→___→___→___→排出。","answer":"口 → 食管 → 胃 → 小肠 → 大肠 → 排出体外。"},{"id":22,"phase":"四上","question":"门齿、犬齿、臼齿分别做什么用？","answer":"门齿：切断食物（扁平）。犬齿：撕裂食物（尖锐）。臼齿：研磨食物（宽大）。"},{"id":23,"phase":"四上","question":"胃和小肠在消化中各起什么作用？","answer":"胃：暂时储存食物，通过蠕动和胃液对食物进行初步消化，将食糜缓慢运输到小肠。小肠：长 3~5 米，有很多皱褶，是食物消化与营养吸收的主要场所。"},{"id":24,"phase":"四上","question":"声音是怎么产生的？声音强弱由什么决定？高低由什么决定？","answer":"声音由物体振动产生。声音强弱（响度）由振幅决定——振幅大→声音强。声音高低（音调）由振动频率决定——振动快→声音高，振动慢→声音低。"},{"id":25,"phase":"四上","question":"真空能传声吗？声音在固体、液体、气体中传播速度谁最快？","answer":"真空不能传声（声音传播需要介质）。传播速度：固体 > 液体 > 气体。例如声音在铁中约 5200m/s，水中约 1500m/s，空气中约 340m/s。"},{"id":26,"phase":"四上","question":"鼓膜破了为什么影响听力？","answer":"鼓膜是声音传入内耳的关键环节——声波引起鼓膜振动，振动传递给听小骨再到耳蜗。鼓膜穿孔后振动效率大幅降低，声音无法有效传入内耳，导致听力下降。"}];

function fmtDate(d){return d.toISOString().slice(0,10)}
function todayStr(){return fmtDate(new Date())}
function getWeekInfo(){
  const start=new Date('2026-07-07');const now=new Date();
  const diff=Math.floor((now-start)/(86400000));const wk=Math.floor(diff/7)+1;
  const wkStart=new Date(start.getTime()+(wk-1)*7*86400000);
  const wkEnd=new Date(wkStart.getTime()+6*86400000);
  return {week:Math.max(1,wk),start:fmtDate(wkStart),end:fmtDate(wkEnd)};
}

let state=getDefaultState();

let unsaved=false;

function loadState(){
  try{

    if(raw){const parsed=JSON.parse(raw);state=Object.assign(getDefaultState(),parsed);state.v=SCHEMA_VERSION;}
  }catch(e){console.warn('Failed to load state:',e);}
}
function saveState(){
  state.lastSaved=new Date().toISOString();
  try{localStorage.setItem('dash-state',JSON.stringify(state));unsaved=false;updateSaveUI();}catch(e){console.warn('Failed to save:',e);alert('保存失败：localStorage 可能已满。请导出数据备份。');}
}
function markDirty(){unsaved=true;updateSaveUI();clearTimeout(saveTimeout);saveTimeout=setTimeout(saveState,2000);}
function updateSaveUI(){

function exportState(){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='dash-backup-'+todayStr()+'.json';a.click();
}
function importState(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(){
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();r.onload=function(){
      try{
        const data=JSON.parse(r.result);
        if(confirm('确定要导入备份数据吗？当前未保存的修改将丢失。')){state=Object.assign(getDefaultState(),data);saveState();renderAll();}
      }catch(e){alert('导入失败：文件格式不正确');}
    };r.readAsText(f);
  };inp.click();
}
function resetState(){
  if(confirm('确定要重置所有跟踪数据吗？此操作不可恢复。建议先导出备份。')){state=getDefaultState();saveState();renderAll();}
}

// ===== TOPIC HELPERS =====
function getTopicKey(subj,idx){return subj+'-'+idx;}
function getTopicStatus(subj,idx){return state.topicStatus[getTopicKey(subj,idx)]||{started:false,completed:false,mastery:'none',notes:'',lastUpdated:null};}
function setTopicStatus(subj,idx,updates){
  const k=getTopicKey(subj,idx);state.topicStatus[k]=Object.assign(getTopicStatus(subj,idx),updates,{lastUpdated:new Date().toISOString()});markDirty();
}
function getSubjectProgress(subj){
  const topics=PLAN_DATA[subj]||[];if(!topics.length)return {total:0,started:0,completed:0,mastered:0,percent:0};
  let started=0,completed=0,mastered=0;
  topics.forEach((_,i)=>{const s=getTopicStatus(subj,i);if(s.started)started++;if(s.completed)completed++;if(s.mastery==='good'||s.mastery==='excellent')mastered++;});
  return {total:topics.length,started,completed,mastered,percent:Math.round((completed/topics.length)*100)};
}

// ===== SELF-CHECK HELPERS =====
function getSCKey(id){return 'sc-'+id;}
function getSCStatus(id){return state.selfCheckStatus[getSCKey(id)]||{status:'none',lastTested:null,notes:''};}
function setSCStatus(id,st){state.selfCheckStatus[getSCKey(id)]={status:st,lastTested:fmtDate(new Date()),notes:''};markDirty();}
function getSCSummary(){
  const counts={pass:0,warn:0,fail:0,none:0};
  for(let i=1;i<=26;i++){const s=getSCStatus(i).status;counts[s]=(counts[s]||0)+1;}
  counts.total=26;counts.done=counts.pass+counts.warn+counts.fail;return counts;
}

// ===== FILE LINKS =====
function buildPath(rel){return state.settings.basePath.replace(/\/+$/,'')+'\\'+rel.replace(/\//g,'\\');}
function fileLink(rel,label){
  const p=buildPath(rel);
  if(isLocal){
    const fp='file:///'+p.replace(/\\/g,'/');
    return '<span class="file-link-row"><a href="'+fp+'" target="_blank">📄 '+esc(label||rel)+'</a> <button class="copy-btn" onclick="event.preventDefault();copyPath(\''+p.replace(/\\/g,'\\\\')+'\',this)" title="复制路径">📋</button></span>';
  }else{
    return '<span class="file-link-row"><span style="color:var(--gray-500);font-size:.82rem">📄 '+esc(label||rel)+'</span> <span style="font-size:.7rem;color:var(--gray-400)">（仅本地可用）</span></span>';
  }
}
function copyPath(path,btn){
  navigator.clipboard.writeText(path).then(()=>{btn.textContent='✓';setTimeout(()=>btn.textContent='📋',1500);}).catch(()=>{alert('复制失败，路径：'+path);});
}
function getDailyPlanFiles(dateStr){
  const d=new Date(dateStr);const days=['日','一','二','三','四','五','六'];
  const label=dateStr+' 星期'+days[d.getDay()];
  return {label,mathRel:'每日计划\\'+dateStr+'-数学.md',scienceRel:'每日计划\\'+dateStr+'-科学.md'};
}

// ===== DECISION RULES =====
function evaluateRules(){
  const alerts=[];
  // Rule 1: oral speed stagnant 2+ weeks
  const weeks=Object.keys(state.oralRecords).reduce((acc,d)=>{const wk=getWeekInfo();return acc;},{});
  // Rule 2: self-check stuck
  const stuck=[];for(let i=1;i<=26;i++){if(getSCStatus(i).status==='fail')stuck.push(i);}
  if(stuck.length>0)alerts.push({severity:'warn',icon:'⚠️',msg:stuck.length+' 道自检题未通过：第 '+stuck.join('、')+' 题。建议回顾对应实验/知识点。'});
  // Rule 3: low completion rate
  const mp=getSubjectProgress('math'),sp=getSubjectProgress('science');
  const wi=getWeekInfo();
  if(wi.week>2&&mp.percent<30)alerts.push({severity:'info',icon:'📌',msg:'数学进度偏慢（'+mp.percent+'%），当前第 '+wi.week+' 周。检查每日计划是否在执行。'});
  if(wi.week>2&&sp.percent<30)alerts.push({severity:'info',icon:'📌',msg:'科学进度偏慢（'+sp.percent+'%），当前第 '+wi.week+' 周。检查每日实验是否在完成。'});
  // Rule 4: any time — child asks questions = follow curiosity
  alerts.push({severity:'success',icon:'💡',msg:'如果孩子主动提问或对某件事表现出强烈好奇——放下计划，跟着 TA 的好奇心走。这是最好的学习时机。'});
  return alerts;
}

let hwCurrentImages=[];

function handleGradingFile(input){
  const files=Array.from(input.files);if(!files.length)return;
  hwCurrentImages=[];
  const preview=document.getElementById('gradingPreview');
  preview.innerHTML='';
  let loaded=0;
  files.forEach((f,i)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      hwCurrentImages.push({name:f.name,data:e.target.result,type:f.type});
      loaded++;
      preview.innerHTML+='<img src="'+e.target.result+'" class="grading-img" style="margin:4px;max-height:200px" title="'+f.name+'">';
      if(loaded===files.length)updateHWTopicSuggest();
    };
    reader.readAsDataURL(f);
  });
}

function onHWResultChange(num){
  const sel=document.getElementById('hwRes'+num);const errSel=document.getElementById('hwErrType'+num);
  errSel.disabled=(sel.value==='correct');
  if(sel.value==='correct'){errSel.value='';document.getElementById('hwScore'+num).value=document.getElementById('hwMax'+num).value;}
  else if(sel.value==='half'){document.getElementById('hwScore'+num).value=Math.floor(parseInt(document.getElementById('hwMax'+num).value)/2);}
  else{document.getElementById('hwScore'+num).value='0';}
}

function saveHomeworkRecord(){
  const date=document.getElementById('hwDate').value;
  const subject=document.getElementById('hwSubject').value;
  const topic=document.getElementById('hwTopic').value;
  const total=parseInt(document.getElementById('hwTotal').value)||10;
  const notes=document.getElementById('hwNotes').value;
  if(!date){alert('请选择日期');return;}
  const problems=[];
  for(let i=1;i<=total;i++){
    const resEl=document.getElementById('hwRes'+i);if(!resEl)continue;
    const correctVal=resEl.value;
    problems.push({
      num:i,
      correct:correctVal==='correct'?true:correctVal==='half'?'half':false,
      score:parseInt(document.getElementById('hwScore'+i)?.value)||0,
      maxScore:parseInt(document.getElementById('hwMax'+i)?.value)||5,
      errorType:correctVal==='correct'?'':(document.getElementById('hwErrType'+i)?.value||''),
      errorDetail:document.getElementById('hwErrDetail'+i)?.value||'',
      linkedTopic:document.getElementById('hwLinkedTopic'+i)?.value||''
    });
  }
  const subjectLabels={math:'数学',science:'科学',chinese:'语文',english:'英语'};
  const topicTitle=topic?(PLAN_DATA[subject]?.find((_,i)=>subject+'-'+i===topic)?.title||topic):'';
  const rec={
    id:'hw-'+Date.now(),
    date,subject,subjectLabel:subjectLabels[subject]||subject,topic:topicTitle||'',topicKey:topic,
    images:hwCurrentImages.map(img=>({name:img.name,data:img.data})),
    imageData:hwCurrentImages.length>0?hwCurrentImages[0].data:null,
    problems,
    summary:{total,correct:problems.filter(p=>p.correct===true).length,wrong:problems.filter(p=>p.correct===false||p.correct==='half').length,score:problems.reduce((s,p)=>s+p.score,0),maxScore:problems.reduce((s,p)=>s+p.maxScore,0)},
    aiGraded:false,
    notes,
    createdAt:new Date().toISOString()
  };
  if(!state.homeworkRecords)state.homeworkRecords=[];
  state.homeworkRecords.push(rec);markDirty();renderAll();
  alert('批改记录已保存！错题 '+rec.summary.wrong+' 道，得分 '+rec.summary.score+'/'+rec.summary.maxScore);
}

function deleteHomeworkRecord(idx){
  if(confirm('确定删除这条批改记录？')){state.homeworkRecords.splice(idx,1);markDirty();renderAll();}
}

function getErrorStats(){
  const records=state.homeworkRecords||[];
  const byType={'知识盲区':0,'理解偏差':0,'操作失误':0,'粗心':0};
  const byTopic={};let totalWrong=0;
  records.forEach(rec=>{
    (rec.problems||[]).forEach(p=>{
      if(p.correct===false||p.correct==='half'){
        totalWrong++;
        if(p.errorType)byType[p.errorType]=(byType[p.errorType]||0)+1;
        const t=p.linkedTopic||rec.topic||'(未分类)';byTopic[t]=(byTopic[t]||0)+1;
      }
    });
  });
  return {totalWrong,byType,byTopic};
}

function importAIResult(){
  const json=prompt('请粘贴 Claude 返回的 JSON 批改结果：');
  if(!json)return;
  try{
    const result=JSON.parse(json);
    if(!result.problems||!Array.isArray(result.problems)){alert('JSON格式错误：缺少 problems 数组');return;}
    // Fill the grading form
    if(!hwGradingFormGenerated){
      document.getElementById('hwTotal').value=result.problems.length;
      generateHWGradingForm();
    }
    result.problems.forEach(p=>{
      const resEl=document.getElementById('hwRes'+p.num);
      if(!resEl)return;
      if(p.correct===true)resEl.value='correct';
      else if(p.correct==='half')resEl.value='half';
      else resEl.value='wrong';
      onHWResultChange(p.num);
      if(p.errorType){const et=document.getElementById('hwErrType'+p.num);if(et)et.value=p.errorType;}
      if(p.errorDetail){const ed=document.getElementById('hwErrDetail'+p.num);if(ed)ed.value=p.errorDetail;}
      if(p.linkedTopic){const lt=document.getElementById('hwLinkedTopic'+p.num);if(lt)lt.value=p.linkedTopic;}
      if(p.score!==undefined){const sc=document.getElementById('hwScore'+p.num);if(sc)sc.value=p.score;}
    });
    alert('已导入 '+result.problems.length+' 道题的批改结果，请核对后点击"保存批改记录"。');
  }catch(e){alert('JSON 解析失败：'+e.message);}
}

  document.getElementById('todayDisplay').textContent='📅 '+todayStr();

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveState();}});
